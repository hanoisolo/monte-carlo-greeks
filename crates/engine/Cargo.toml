[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "Monte Carlo option pricing and Greeks engine compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
